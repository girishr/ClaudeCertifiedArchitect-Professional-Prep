# ClaudeCertifiedArchitect-Professional-Prep - SDD Project Configuration
name: "ClaudeCertifiedArchitect-Professional-Prep"
version: "1.0.0"
language: en
description: "Static Website — a free companion to Anthropic's official five-module prep path for the Claude Certified Architect - Professional (CCAR-P) exam. It distils the official material so it can be read rather than sat through, and adds the practice layer the official path does not provide: a 21-day study plan, a 75-question scenario bank with per-distractor explanations, and per-domain scoring against the published exam weighting. Two surfaces: a single-page hub (index.html, generated by tools/build_hub.py) with Course, Study plan, Practice, Results and Exam brief tabs, and long-form course pages under course/ with a persistent side nav. Plain HTML, CSS and vanilla JS on GitHub Pages; no framework, no bundler, no backend."
category: static
type: existing-codebase
handle: "girishr"

# Rules and mandates: see your AI agent configuration file (single source of truth)

# Team Guidelines
team:
  devPrefix: "girishr"
  code_review_required: true
  testing_required: true
  documentation_required: true

# Platforms
platforms:
  - "web"
ide_agent: claudecode

# Build and Deployment
build:
  command: "npm run build"
